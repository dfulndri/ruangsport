services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ruangsport_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - ruangsport_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: ruangsport_nginx
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ruangsport_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ruangsport_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ruangsport_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: ruangsport_user
      MYSQL_PASSWORD: ruangsport_pass
    ports:
      - "3306:3306"
    volumes:
      - ruangsport_dbdata:/var/lib/mysql
    networks:
      - ruangsport_network

networks:
  ruangsport_network:
    driver: bridge

volumes:
  ruangsport_dbdata:
    driver: local